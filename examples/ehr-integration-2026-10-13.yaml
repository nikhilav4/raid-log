  - id: R-002
    type: risk
    title: Duplicate patient records in the legacy MPI could overlay charts during the merge
    description: >-
      A sample of the master patient index shows about 2 percent potential duplicates.
      Merging the wrong pair puts one patient's history in another patient's chart.
    owner: Marcus Bell
    status: mitigating
    raised: 2026-09-09
    review_by: 2026-11-05
    probability: 3
    impact: 5
    mitigation: Probabilistic match on the full extract; HIM works the potential-duplicate queue before cutover
    contingency: Hold unresolved pairs out of the merge and register those patients manually during hypercare
    workstream: Data migration
    tags: [mpi, patient-safety]
    log:
      - {date: 2026-10-07, note: "First match run flagged 1,840 pairs for HIM review"}

